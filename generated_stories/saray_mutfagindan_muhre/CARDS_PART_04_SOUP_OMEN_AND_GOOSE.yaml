    routeFamily: "soup_goose"
    title: "Çorba Alameti ve Ak Gaga: İlk Eşik"
    bodyText: "Yağ halkaları ve üç nohut, sarayın gülüp geçemeyeceği kadar isabetli görünmeye başlar. Çorba Alameti ve Ak Gaga: İlk Eşik anında Müneccim Zerya, senden alameti uydurmak ile bozmak arasında karar bekler. Kehanet çorbası artık sarayda küçük bir şaka değil, varislerin kendi lehine çevirmek istediği ciddi bir alamettir. Ak Gaga'nın davranışı divanda bir devlet işareti gibi yorumlanır ve oyuncunun önceki yem tercihleri hatırlanır. Seçeceğin yol, çorba alametinin ve Ak Gaga yorumlarının üzerinde kalıcı bir iz bırakacak."
    backgroundId: "bg_buyuk_mutfak_atesli"
    focusImageId: "focus_smm_076_soup_goose"
    focusImagePrompt: "2D illustrated storybook style, hand-drawn painterly feeling, warm muted colors, readable silhouettes, Çorba Alameti ve Ak Gaga: İlk Eşik scene for Saray Mutfağından Mühre, showing Yetim bulaşıkçı, Müneccim Zerya, Durna, a bowl of omen soup with oil rings and three chickpeas, the dignified palace goose Ak Gaga nearby, no photorealism, no 3D render look, no text, no watermark, no logo"
    presentCharacters:
      - "player_yetim"
      - "muneccim_zerya"
      - "durna_kazci"
    dialogue:
      -
        speakerId: "muneccim_zerya"
        emotion: "düşünceli"
        text: "Saray, güldüğü şeye ertesi gün secde edebilir."
      -
        speakerId: "muneccim_zerya"
        emotion: "ürpermiş"
        text: "Bu çorbanın yüzeyinde tesadüf değil, sarayın korkusu yüzüyor."
    choices:
      -
        choiceId: "smm_card_076_a"
        text: "Çorbanın alametini dürüstçe açıkla"
        resultText: "Çorba Alameti ve Ak Gaga: İlk Eşik kararında hesabı açık tutarsın. Müneccim Zerya bunu fark eder ve çorba alametinin ve Ak Gaga yorumlarının dengesi senin lehine bir çizik alır."
